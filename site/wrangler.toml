# The tapeloop.stream website: static files in public/, served by a Cloudflare Worker with static assets.
# Deploy: cd site && npx wrangler deploy   (needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID)
name = "tapeloop-site"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "tapeloop.stream", custom_domain = true },
  { pattern = "www.tapeloop.stream", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
